name: Feature request
description: Suggest an enhancement for this plugin
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve for store owners or developers?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from a user or developer perspective?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you already tried or considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or Klaviyo/Craft specifics that help.
