name: Bug report
description: Something is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: craft_version
    attributes:
      label: Craft CMS version
      placeholder: e.g. 5.6.0
    validations:
      required: true
  - type: input
    id: commerce_version
    attributes:
      label: Craft Commerce version
      placeholder: e.g. 5.2.0
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3.6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact API keys and personal data before pasting.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and could not find a duplicate.
          required: true
        - label: I am not sharing private API keys or customer PII in this report.
          required: true
